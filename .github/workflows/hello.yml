name: Hello AI CI/CD

on:
  push:
    branches:
      - develop
      - release
      - main
      - "feature/**"

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: first_rg
  REGISTRY: helloaiacr.azurecr.io
  IMAGE_NAME: hello-ai

jobs:

  ci:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Black
        run: black --check src tests

      - name: Run Flake8
        run: flake8 src tests

      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -v

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name helloaiacr

      - name: Push Docker Image
        run: |
          docker tag \
            $IMAGE_NAME:${{ github.sha }} \
            $REGISTRY/$IMAGE_NAME:${{ github.sha }}

          docker push \
            $REGISTRY/$IMAGE_NAME:${{ github.sha }}

  deploy-experiment:
    if: startsWith(github.ref, 'refs/heads/feature/')
    needs: ci
    runs-on: ubuntu-latest

    environment: experiment

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Experiment
        run: |
          az containerapp update \
            --name hello-ai-experiment \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY/$IMAGE_NAME:${{ github.sha }}

  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    needs: ci
    runs-on: ubuntu-latest

    environment: dev

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Dev
        run: |
          az containerapp update \
            --name hello-ai \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY/$IMAGE_NAME:${{ github.sha }}

  deploy-uat:
    if: github.ref == 'refs/heads/release'
    needs: ci
    runs-on: ubuntu-latest

    environment: uat

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to UAT
        run: |
          az containerapp update \
            --name hello-ai-uat \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY/$IMAGE_NAME:${{ github.sha }}

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest

    environment: prod

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Production
        run: |
          az containerapp update \
            --name hello-ai-prod \
            --resource-group $RESOURCE_GROUP \
            --image $REGISTRY/$IMAGE_NAME:${{ github.sha }}

      - name: Verify Deployment
        run: |
          az containerapp show \
            --name hello-ai-prod \
            --resource-group $RESOURCE_GROUP \
            --query properties.latestRevisionName \
            --output table